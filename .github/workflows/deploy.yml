name: Deploy to S3

on:
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Outputs of authenta-infrastructure's live/prod/docs-site unit. The role only trusts runs on main.
  DOCS_BUCKET: authenta-prod-docs
  DOCS_DISTRIBUTION_ID: ${{ vars.DOCS_DISTRIBUTION_ID }}
  DEPLOY_ROLE_ARN: arn:aws:iam::480007295971:role/authenta-docs-deploy

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: production
      url: https://docs.authenta.ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Build the application
        run: |
          bun install --frozen-lockfile
          bun run lint
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Fingerprinted bundles first, so pages never reference assets that aren't there yet.
      - name: Upload assets
        run: aws s3 sync docs/dist/assets "s3://$DOCS_BUCKET/assets" --cache-control "public, max-age=31536000, immutable"

      # Pages, spec, Postman collection, images: always revalidated so a deploy shows up immediately.
      - name: Upload pages and public files
        run: aws s3 sync docs/dist "s3://$DOCS_BUCKET" --exclude "assets/*" --delete --cache-control "public, max-age=0, must-revalidate"

      # Old bundles go only after the pages referencing them are replaced.
      - name: Remove stale assets
        run: aws s3 sync docs/dist/assets "s3://$DOCS_BUCKET/assets" --delete --cache-control "public, max-age=31536000, immutable"

      # Pages already revalidate on every request; this clears cached error pages and edge copies from older deploys.
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$DOCS_DISTRIBUTION_ID" --paths "/*"
